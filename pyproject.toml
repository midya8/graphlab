[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlab-audit"
version = "0.2.0"
description = "Explicit two-layer graph convolution and evaluation audits"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
graphlab = "graphlab.cli:main"

[tool.setuptools.packages.find]
include = ["graphlab*"]
